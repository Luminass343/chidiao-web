const radiusOf = v => {
  const s = Math.sqrt(Math.max(0, v));
  return 12 + 1.6 * Math.min(s, 31.62) + 0.8 * Math.max(0, s - 31.62);
};
const eRad = e => (e.radCur != null ? e.radCur : radiusOf(e.value) * (e.sizeMul || 1));
const pHalf = () => Math.max(24, radiusOf(playerValue()) * ST.psizeMul * 0.95);
const pHalfX = () => Math.max(16, pHalf() * 0.64);
const OCT_K = 2 / (2 + Math.SQRT2);
function circleOctHit(cx, cy, cr, px, py, hx, hy, slop) {  // 圆 vs 八边形（左右更窄）
  let x = clampN(cx - px, -hx, hx), y = clampN(cy - py, -hy, hy);
  const k = OCT_K * (hx + hy) / 2;
  const d = hx + hy - k;
  const sx = x >= 0 ? 1 : -1, sy = y >= 0 ? 1 : -1;
  const u = sx * x + sy * y;
  if (u > d) { const t = (u - d) / 2; x -= sx * t; y -= sy * t; }
  x = clampN(x, -hx, hx); y = clampN(y, -hy, hy);
  return Math.hypot(cx - px - x, cy - py - y) < cr + (slop || 0);
}
function segClosest(px, py, ax, ay, bx2, by2) {
  const abx = bx2 - ax, aby = by2 - ay;
  const t = clampN(((px - ax) * abx + (py - ay) * aby) / (abx * abx + aby * aby || 1), 0, 1);
  return [ax + abx * t, ay + aby * t];
}

};

/* ============ 极简合成音效 ============ */
let AC = null;
function initAudio() {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume(); } catch (e) {}
}
function beep(freq, dur = 0.1, vol = 0.1, type = "sine") {
  try {
    initAudio(); if (!AC) return;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
const seq = (arr, step = 80, vol = 0.1) =>
  arr.forEach((f, i) => setTimeout(() => beep(f, 0.12, vol), i * step));

/* ============ 合成 BGM（低音量琶音循环，M 键开关） ============ */
const BGM = {
  next: 0, step: 0,
  NOTES: [220, 0, 261.6, 329.6, 0, 329.6, 440, 0,   196, 0, 246.9, 293.7, 0, 293.7, 392, 0,
          174.6, 0, 220, 261.6, 0, 261.6, 349.2, 0, 196, 0, 246.9, 293.7, 0, 392, 0, 293.7],
  update() {
    try {
      if (!AC || ST.bgmMuted) return;
      const playing = ST.active && (ST.scene === "play" || ST.scene === "levelup" || ST.scene === "pause");
      if (!playing) { this.next = Math.max(this.next, AC.currentTime + 0.1); return; }
      while (this.next < AC.currentTime + 0.35) {
        const f = this.NOTES[this.step % this.NOTES.length];
        const when = Math.max(this.next, AC.currentTime);
        if (f > 0) {
          const o = AC.createOscillator(), g = AC.createGain();
          o.type = "triangle"; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, when);
          g.gain.linearRampToValueAtTime(0.026, when + 0.03);
          g.gain.exponentialRampToValueAtTime(0.0001, when + 0.5);
          o.connect(g); g.connect(AC.destination);
          o.start(when); o.stop(when + 0.55);
        }
        this.step++; this.next += 0.24;
      }
    } catch (e) {}
  },
};

const LB_KEY = "clash_web_lb_v1";

function lbSubmit(rec) {
  const l = lbLoad(); l.push(rec);

/* ============ 全服共享排行榜 + 留言板（textdb.dev 免后端键值存储） ============ */
const CLOUD_LB = "https://textdb.dev/api/data/chidiao-lb-efrm0x06";
const CLOUD_MSG = "https://textdb.dev/api/data/chidiao-msg-efrm0x06";
function cloudFetch(url, body) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 4500);
  const opt = { signal: ctl.signal, headers: {} };
  if (body) { opt.method = "POST"; opt.body = body; opt.headers["Content-Type"] = "text/plain"; }
  return fetch(url, opt).then(r => { if (!r.ok) throw new Error("http " + r.status); return r.text(); })
    .finally(() => clearTimeout(t));
}
function cloudLoadList(key) {                          // 失败返回 null（区分"空表"）
  return cloudFetch(key).then(s => {
    const a = JSON.parse(s);
    return Array.isArray(a) ? a : [];
  }).catch(() => null);
}
const cloudNum = (v, m) => { const n = Math.round(Number(v) || 0); return isFinite(n) ? Math.max(0, Math.min(m, n)) : 0; };
const cloudStr = (s, m) => String(s || "").replace(/[\u0000-\u001f<>]/g, "").trim().slice(0, m);
function playerName() {
  try { return (localStorage.getItem("clash_name") || "").trim().slice(0, 12) || "匿名玩家"; }
  catch (e) { return "匿名玩家"; }
}
function cloudSubmitScore(rec) {                       // GET→追加→PUT（读改写，怕并发但够朋友局用）
  return cloudLoadList(CLOUD_LB).then(list => {
    if (!list) return null;
    const entry = { code: rec.code, name: cloudStr(rec.name, 12) || "匿名玩家",
      peak: cloudNum(rec.peak, 1e9), wave: cloudNum(rec.wave, 9999), kills: cloudNum(rec.kills, 1e6),
      time: cloudNum(rec.time, 86400), level: cloudNum(rec.level, 9999), grazes: cloudNum(rec.grazes, 1e6),
      ver: cloudStr(rec.ver, 12), ts: cloudStr(rec.ts, 24) };
    if (!entry.peak) return null;
    list.push(entry);
    list.sort((a, b) => (b.peak || 0) - (a.peak || 0));
    const cap = list.slice(0, 100);
    return cloudFetch(CLOUD_LB, JSON.stringify(cap)).then(() => ({
      entry, rank: cap.findIndex(r => r.code === entry.code) + 1, total: cap.length, list: cap }));
  }).catch(() => null);
}
function cloudSendMessage(rec) {
  return cloudLoadList(CLOUD_MSG).then(list => {
    if (!list) return null;
    const text = cloudStr(rec.text, 60);
    if (!text) return null;
    const cap = [{ name: cloudStr(rec.name, 12) || "匿名玩家", text, ts: cloudStr(rec.ts, 24) }, ...list].slice(0, 50);
    return cloudFetch(CLOUD_MSG, JSON.stringify(cap)).then(() => cap);
  }).catch(() => null);
}
function cloudRename(code, name) {                     // 直接改本条云端成绩的 ID
  return cloudLoadList(CLOUD_LB).then(list => {
    if (!list) return null;
    const rec = list.find(r => r.code === code);
    if (!rec) return null;
    rec.name = cloudStr(name, 12) || "匿名玩家";
    return cloudFetch(CLOUD_LB, JSON.stringify(list)).then(() => list);
  }).catch(() => null);
}
function kickCloud() {                                 // 败北后一次性触发：上传成绩 + 拉留言
  ST.cloudState = "loading";
  cloudSubmitScore({ code: ST.myCode, name: playerName(),
    peak: Math.round(ST.peak), wave: ST.wave, kills: ST.kills,
    time: Math.round(ST.t), level: ST.level, grazes: ST.grazeN,
    ver: VERSION, ts: nowStr() }).then(r => {
    if (r) {
      ST.cloudState = "ok"; ST.cloudRank = r.rank; ST.cloudTotal = r.total; ST.cloudList = r.list;
      if (ST.renamePending) {                          // 上传期间改过名：补改本条
        ST.renamePending = false;
        cloudRename(ST.myCode, playerName()).then(list => {
          if (list) { ST.cloudList = list; ST.idUpdT = ST.t; }
        });
      }
    } else ST.cloudState = "fail";

}

  const tg = e.target && e.target.tagName;
  if (tg === "INPUT" || tg === "TEXTAREA") return;   // 输入框里打字不触发游戏键
  const k = KEYMAP[e.code];
  if (e.code === "KeyM" && !e.repeat) { ST.bgmMuted = !ST.bgmMuted; return; }
  if (!k) return;
  e.preventDefault();
  initAudio();
  if (!e.repeat) { held[k] = true; hit[k] = true; }
});
addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) held[k] = false; });
addEventListener("blur", () => { for (const k in held) held[k] = false; });
const isPressed = k => !!held[k];
const isTriggered = k => !!hit[k];
const clearTriggers = () => { for (const k in hit) hit[k] = false; };
/* ============ 触控 / 指针（手机虚拟摇杆 + 冲刺/暂停按钮 + 菜单点按） ============ */
const TOUCH = {
  on: (typeof matchMedia === "function") && matchMedia("(pointer: coarse)").matches,
  joyId: null, joyBX: 0, joyBY: 0, dx: 0, dy: 0, R: 48,
};
const BTN = { dash: { x: W - 92, y: H - 92, r: 58 }, pause: { x: W - 36, y: 36, r: 22 } };
let clickAt = null;
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); initAudio();
  TOUCH.on = true;
  const p = toGame(e);
  const inB = (b, pad = 10) => Math.hypot(p.x - b.x, p.y - b.y) < b.r + pad;
  // 菜单场景（升级/暂停/结算）：整屏点选，绝不抓摇杆——否则左边选项点不到
  if (ST.scene === "levelup" || ST.scene === "pause" || ST.scene === "over") {
    clickAt = p; return;
  }
  if (ST.scene === "intro") { hit.ok = true; return; }       // 点任意处开始
  if (inB(BTN.dash)) { hit.ok = true; return; }              // 冲刺按钮 = 空格
  if (inB(BTN.pause)) { hit.cancel = true; return; }         // 暂停按钮 = Esc
  if (p.x < W * 0.5) {                                       // 左半屏 = 虚拟摇杆（仅游戏进行中）
    TOUCH.joyId = e.pointerId; TOUCH.joyBX = p.x; TOUCH.joyBY = p.y;
    TOUCH.dx = 0; TOUCH.dy = 0; return;
  }
  clickAt = p;                                               // 右侧空白点选（预留）
});
cv.addEventListener("pointermove", e => {
  if (e.pointerId !== TOUCH.joyId) return;
  const p = toGame(e);
  let dx = p.x - TOUCH.joyBX, dy = p.y - TOUCH.joyBY;
  const d = Math.hypot(dx, dy);
  if (d > TOUCH.R) { dx = dx / d * TOUCH.R; dy = dy / d * TOUCH.R; }
  TOUCH.dx = dx; TOUCH.dy = dy;
});
const endTouch = e => {
  if (e.pointerId === TOUCH.joyId) { TOUCH.joyId = null; TOUCH.dx = 0; TOUCH.dy = 0; }
};
cv.addEventListener("pointerup", endTouch);
cv.addEventListener("pointercancel", endTouch);
cv.addEventListener("contextmenu", e => e.preventDefault());

    pvAvg: 10, bossPreset: 350, bossFloor: 0, curRound: 1, bossDeployed: false, bossQueued: false,

    overView: 0, cloudState: "idle", cloudRank: 0, cloudTotal: 0, cloudList: null,

  });
  MIRROR_TRACE = [];

function dismissIntro() {

/* ============ 波次与刷怪 ============ */
function buildWaveSchedule() {                          // v0.46：保底日程
  ST.forceQ = [
    { kind: "bounce", at: rnd(0.5, 4) },
    { kind: "bounce", at: rnd(4, 8) },
  ];
  if (ST.wave >= 2) ST.forceQ.push({ kind: "big", at: rnd(2, 15) });
  if (ST.wave >= 4) ST.forceQ.push({ kind: "big", at: rnd(6, 18) });
  ST.forceQ.sort((a, b) => a.at - b.at);
}
function pickKind() {
  const r = Math.random();
  if (ST.wave >= 2 && r < 0.08) return "big";
  if (ST.waveT >= 14 && r < 0.30) return "bounce";
  return "chase";
}
function placeAtEdge(e) {
  const m = 50, side = (Math.random() * 4) | 0;
  e.x = side === 0 ? rnd(0, W) : side === 1 ? W + m : side === 2 ? rnd(0, W) : -m;
  e.y = side === 0 ? -m : side === 1 ? rnd(0, H) : side === 2 ? H + m : rnd(0, H);
}
function spawnEnemy() { spawnEnemyOfKind(pickKind(), false); }
function spawnEnemyOfKind(kind, forced) {
  const pv = playerValue();
  let v, sizeMul = 1;
  if (kind === "big") {
    const t = rnd(0.55, 0.7);
    v = Math.round(Math.max(pv * t, Math.min(15 + ST.wave * 5, pv * 0.55)));
  } else if (kind === "bounce") {
    const fx = (15 + ST.wave * 8) * rnd(0.8, 1.1);
    v = Math.round(fx + Math.min(pv * 0.08, fx));
  } else {
    v = Math.round((4 + ST.wave * 4 + Math.max(0, ST.wave - 4) * 9) * rnd(0.7, 1.3));
    sizeMul = 0.5;
  }
  const floorV = Math.max(3, ST.wave * 2);
  if (!forced && ST.budget < floorV) return;
  if (!forced) v = Math.min(v, ST.budget);
  ST.budget = Math.max(0, ST.budget - v);
  const color = kind === "big" ? "#ff4d6d" : kind === "bounce" ? "#4dd8ff" : "#ff7a4d";
  const e = { value: v, cd: 0, x: 0, y: 0, boss: false, kind, sizeMul, color };
  placeAtEdge(e);
  if (kind === "bounce") {
    const a = Math.atan2(H / 2 - e.y, W / 2 - e.x) + rnd(-0.7, 0.7);
    e.bx = Math.cos(a); e.by = Math.sin(a);
  }
  ST.enemies.push(e);
}

/* ============ 黑球：横穿屏幕的纯危害物 ============ */
function spawnBlackDir(x, y, dx, dy) {
  const d = Math.hypot(dx, dy) || 1;
  ST.blacks.push({ x, y, r: 26, bx: dx / d, by: dy / d, cd: 0, ph: rnd(0, 6.28) });
}
function spawnBlack() {
  const side = (Math.random() * 4) | 0, m = 70;
  let x, y, tx, ty;
  if (side === 0)      { x = -m; y = rnd(70, H - 70); tx = W + m; ty = rnd(70, H - 70); }
  else if (side === 1) { x = W + m; y = rnd(70, H - 70); tx = -m; ty = rnd(70, H - 70); }
  else if (side === 2) { x = rnd(70, W - 70); y = -m; tx = rnd(70, W - 70); ty = H + m; }
  else                 { x = rnd(70, W - 70); y = H + m; tx = rnd(70, W - 70); ty = -m; }
  spawnBlackDir(x, y, tx - x, ty - y);
  beep(140, 0.2, 0.12, "sawtooth");
}
function updateBlacks(dt, px, py) {
  if (ST.wave >= 2 && ST.breather <= 0) {
    ST.blackT -= dt;
    if (ST.blackT <= 0) {
      spawnBlack();
      ST.blackT = rnd(9, 15) * Math.max(0.35, 1 - ST.wave * 0.05);
    }
  }
  for (const b of ST.blacks) {
    b.cd = Math.max(0, (b.cd || 0) - dt);
    b.x += b.bx * 120 * dt; b.y += b.by * 120 * dt;
    if (!b.dead && !b.grazed && ST.iframes > 0 &&
        circleOctHit(b.x, b.y, b.r, px, py, pHalfX(), pHalf(), 2)) {
      b.grazed = true; b.dead = true;                 // 黑球消灭
      burst(b.x, b.y, 16, "#b44dff");
      ST.dodgeCd = Math.max(1.5, ST.dodgeCd - 2.5);   // 冷却返还
      ST.chain.n = ST.chain.t > 0 ? ST.chain.n + 1 : 1;
      ST.chain.t = 8;
      ST.grazeN++;
      const cm = [1, 1.5, 2, 2.5][Math.min(ST.chain.n, 4) - 1];
      const gx2 = Math.min(Math.ceil(xpNeed() * 0.25),
        Math.ceil((6 + ST.wave * 2.5) * (1 + 0.15 * ST.upgrades.spd) * cm));
      const gv = Math.round((2 + ST.wave) * (1 + 0.25 * ST.upgrades.spd) * cm);
      gainXp(gx2);
      if (gv > 0) ST.pv = playerValue() + gv;
      pushText(b.x, b.y - 40,
        ST.chain.n >= 2 ? "消除! x" + ST.chain.n + " · " + cm + "倍" : "消除!", "#7dffcf",
        ST.chain.n >= 2 ? 22 : 20);
      if (gv > 0) pushText(b.x, b.y - 64, "+" + gv, "#ffd24d", 15);
      beep(1200, 0.07, 0.1); beep(1600, 0.08, 0.08);
    }
    if (!b.dead && b.cd <= 0 && ST.iframes <= 0 &&
        circleOctHit(b.x, b.y, b.r, px, py, pHalfX(), pHalf(), 2)) {
      b.cd = 1.5;                                      // v0.80：多段触发间隔
      const pvB = playerValue();
      ST.pv = Math.max(1, Math.floor(pvB * 0.5));
      if (ST.upgrades.heal > 0) { ST.regen.ramp = 0; ST.regen.pause = 1.5; ST.regen.resets++; }
      pushText(px, py - 60, "数值 -50%!", "#ff5c5c", 26);
      beep(110, 0.3, 0.18, "sawtooth");
    }
  }
  ST.blacks = ST.blacks.filter(b => !b.dead &&
    !(b.x < -100 || b.x > W + 100 || b.y < -100 || b.y > H + 100));
}

/* ============ Boss 预警 / 生成 ============ */
function startBossWarning() {
  let x, y, tries = 0;
  const estV = Math.min(Math.max(120, playerValue() * 1.1), playerValue() + 300);
  const zr = Math.min(radiusOf(estV), 88);
  const safe = zr + 280;
  do { x = rnd(120, W - 120); y = rnd(120, H - 120); tries++; }
  while (tries < 25 && Math.hypot(x - ST.mx, y - ST.my) < safe);
  ST.bossWarn = { x, y, t: 5, shown: -1, zr };
  ST.bossDeployed = true;
  ST.waveT += BOSS_BONUS;                              // Boss 登场的那一波才加时
  beep(180, 0.35, 0.12, "sawtooth");
}
function updateBossWarn(dt) {
  const w = ST.bossWarn; if (!w) return;
  w.t -= dt;
  const n = Math.max(0, Math.ceil(w.t));
  if (n !== w.shown) { w.shown = n; beep(660, 0.05, 0.07); }
  if (w.t <= 0) {
    const x = w.x, y = w.y;
    ST.bossWarn = null;
    spawnBossAt(x, y);
    burst(x, y, 30, "#b44dff");
  }
}
function spawnBossAt(x, y) {
  const round = ST.curRound;
  const pv = playerValue();
  const v = Math.min(Math.max(120, pv * 1.1) * (1 + 0.15 * (round - 1)), pv + 300);
  const sizeMul = Math.min(1, 88 / radiusOf(v));
  const type = ["round", "bar", "cross", "mirror"][(round - 1) % 4];
  const e = { value: v, cd: 1.2, x, y, boss: true, cracked: false };
  if (type === "bar") {
    e.kind = "bossBar"; e.barL = 300; e.barT = 36; e.color = "#ff9dff";
    const a = rnd(0, 6.28); e.ang = a; e.wang = 0.9;
    e.bx = Math.cos(a + 1.57); e.by = Math.sin(a + 1.57);
    pushText(x, y - 90, "BOSS·横扫", "#ff9dff", 26);
  } else if (type === "cross") {
    e.kind = "bossCross"; e.armL = 130; e.armT = 30; e.color = "#ffb84d";
    e.orbA = rnd(0, 6.28); e.fireT = 2.0;
    pushText(x, y - 90, "BOSS·十字", "#ffb84d", 26);
  } else if (type === "mirror") {
    e.kind = "mirror"; e.color = "#ff4d6d";
    e.radCur = clampN(radiusOf(v), 28, 80);
    e.lx = x; e.ly = y; e.dir = 2; e.animT = 0;
    pushText(x, y - 90, "BOSS·镜", "#ff4d6d", 30);
  } else {
    e.kind = "round"; e.sizeMul = sizeMul; e.color = "#b44dff";
    pushText(x, y - 90, "BOSS·巨岩", "#b44dff", 30);
  }
  ST.enemies.push(e);
  ST.bossSpawned = true;
  ST.lastBoss = { kind: type, v: Math.round(v) };
  beep(90, 0.5, 0.2, "sawtooth");
}
function spawnOrb(x, y, v, life, noMul) {
  if (ST.orbs.length >= 20) return;
  const o = { value: v, x: 0, y: 0, ph: rnd(0, 6.28), life: life != null ? life : null, noMul: !!noMul };
  if (x === undefined) {
    let tries = 0;
    do { o.x = rnd(40, W - 40); o.y = rnd(60, H - 40); tries++; }
    while (tries < 12 && Math.hypot(o.x - ST.mx, o.y - ST.my) < 130);
  } else { o.x = x; o.y = y; }
  ST.orbs.push(o);
}

/* ============ 特效 ============ */
function pushText(x, y, text, color, size = 18) {
  ST.texts.push({ x, y, text, color, size, life: 0.9 });
}
function burst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), sp = rnd(60, 300);
    ST.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, 0.6), color });
  }
}
function decayFx(dt) {
  for (const t of ST.texts) { t.life -= dt; t.y -= 30 * dt; }
  ST.texts = ST.texts.filter(t => t.life > 0);
  for (const p of ST.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  ST.parts = ST.parts.filter(p => p.life > 0);
}

/* ============ 经验与升级 ============ */
function gainXp(v) {
  ST.xp += Math.round(v * ST.xpMul);
  while (ST.xp >= xpNeed()) { ST.xp -= xpNeed(); ST.level++; ST.pending++; }
}
function openLevelup() {
  ST.scene = "levelup"; ST.uiLock = 0.2;
  LU.open = true; LU.sel = 0;
  LU.list = activeChoices();
  seq([523, 659, 784], 90);
}
const CHOICES = [
  { key: "spd", name: "迅捷 +5%", sub: () =>
    "移速+5% · 冲刺" + Math.max(1.5, 5 - 0.2 * (ST.upgrades.spd + 1)).toFixed(1) +
    "s · 消球×" + (1 + 0.25 * (ST.upgrades.spd + 1)).toFixed(2) },
  { key: "mag", name: "吸取范围", sub: () =>
    "磁吸半径 x" + (Math.round(ST.magnetMul * (1 + (ST.magStacks < 3 ? 0.25 : 0.10)) * 10) / 10).toFixed(1) },
  { key: "heal", name: "再生 +1档", sub: () =>
    "每秒+" + ((ST.upgrades.heal + 1) * (0.3 + 0.12 * ST.wave)).toFixed(1) + " · 不受击蓄满" },
  { key: "orb", name: "绿球强化", sub: () => {
    const next = Math.min(4, Math.round((ST.orbMul + (ST.orbLayers < 5 ? 0.2 : 0.05)) * 100) / 100);
    return ST.orbMul >= 4 ? "收益 x4.00（已满级）" : "绿球收益 x" + ST.orbMul.toFixed(2) + " → x" + next.toFixed(2);
  } },
];
function activeChoices() { return CHOICES.filter(c => !(c.key === "orb" && ST.orbMul >= 4)); }
function applyChoice(i) {
  const c = (LU.list && LU.list[i]) || CHOICES[i];
  ST.tlPicks[c.key] = (ST.tlPicks[c.key] || 0) + 1;
  if (c.key === "spd") ST.upgrades.spd++;
  else if (c.key === "mag") {
    const step = ST.magStacks < 3 ? 0.25 : 0.10;
    ST.magStacks++;
    ST.magnetMul = Math.round(ST.magnetMul * (1 + step) * 10) / 10;
  } else if (c.key === "heal") ST.upgrades.heal++;
  else if (c.key === "orb") {
    ST.orbLayers++;
    const step = ST.orbLayers <= 5 ? 0.2 : 0.05;
    ST.orbMul = Math.min(4, Math.round((ST.orbMul + step) * 100) / 100);
  }
  beep(784, 0.1, 0.12);
  ST.pending--;
  if (ST.pending > 0) { LU.list = activeChoices(); if (LU.sel >= LU.list.length) LU.sel = 0; }
  else { LU.open = false; ST.scene = "play"; ST.uiLock = 0.2; }
}

/* ============ 蓝球吞噬（红字阶段 / 冲刺无敌帧） ============ */
function devourBlue(e, hx, hy) {
  const v = Math.round(e.value);
  ST.pv = playerValue() + v;
  ST.popT = 0.3;
  pushText(hx, hy - 36, "吞噬! +" + v, "#ffd24d", 24);
  burst(hx, hy, 16, "#4dd8ff");
  seq([523, 784, 1047], 70);
  e.dead = true;
  ST.kills++;
  const gx = Math.min(Math.ceil(e.value), Math.ceil(xpNeed() * 0.5));
  gainXp(gx);
  pushText(e.x, e.y - 54, "EXP+" + gx, "#7dffcf", 14);
}

/* ============ 击杀结算 ============ */
function killEnemy(e) {
  e.dead = true;
  if (playerValue() > 0.5) {
    ST.kills++;
    const gx = Math.min(
      Math.ceil(e.boss ? e.value * 2 : e.value * (e.kind === "big" ? 0.4 : 1)),
      Math.ceil(xpNeed() * 0.5));
    gainXp(gx);
    pushText(e.x, e.y - 54, "EXP+" + gx, "#7dffcf", 14);
    if (e.boss) {
      const bv2 = Math.max(2, Math.round(e.value * 0.5 / 8));
      for (let i = 0; i < 8; i++)
        spawnOrb(e.x + rnd(-90, 90), e.y + rnd(-70, 90), bv2, null, true);
      pushText(e.x, e.y - 70, "钱袋打穿 · 返还 " + bv2 * 8, "#52ff9a", 20);
    } else if (e.kind === "big") {
      const n = clampN(5 - Math.floor((e.age || 0) / 6), 0, 5);
      const v = Math.max(3, Math.ceil(e.value * 0.25));
      for (let i = 0; i < n; i++)
        spawnOrb(rnd(60, W - 60), rnd(80, H - 80), v, null, true);
      if (n > 0) pushText(e.x, e.y - 70, "奖励 x" + n, "#52ff9a", 16);
    } else if (e.kind === "bounce" && e.orbs != null && e.orbs <= 0) {
      /* 终局大奖在红字吞噬内 */
    } else if (Math.random() < 0.3) {
      spawnOrb(e.x, e.y, Math.max(2, Math.ceil(e.value / 2)));
    }
  }
}

/* ============ 核心：碰撞数值比拼 ============ */
function clashPlayer(ev, ex, ey, kind) {
  const pv = playerValue();
  const px = ST.mx, py = ST.my;
  pushText(ex, ey - 30, Math.round(pv) + " ? " + Math.round(ev), "#ffffff", 20);
  let dmg = ev;
  if (kind === "big" && pv - dmg <= 0.5) dmg = Math.max(0, pv - 1);   // 红球锁1血
  ST.pv = pv - dmg;
  ST.lastHit = kind || "?";
  ST.lastHitV = ev;
  if (ST.upgrades.heal > 0) {
    if (kind === "big") {                                // 手术保险：只暂停不清档
      ST.regen.pause = 1.5;
      ST.regen.redKept = (ST.regen.redKept || 0) + 1;
      pushText(px, py - 76, "手术保险 · 再生档保留", "#52ff9a", 14);
    } else {
      ST.regen.ramp = 0; ST.regen.pause = 1.5; ST.regen.resets++;
    }
  }
  pushText(px, py - 44, "-" + Math.min(dmg, Math.max(0, Math.round(pv))), "#ff6b6b", 22);
  beep(150, 0.15, 0.13, "square");
}

/* ============ 每帧更新（1:1 移植 updateClash） ============ */
function updateClash(dt) {
  ST.t += dt;
  ST.uiLock = Math.max(0, ST.uiLock - dt);
  ST.pvAvg = ST.pvAvg * 0.998 + playerValue() * 0.002;

  /* 升级选择中：世界冻结 */
  if (ST.scene === "levelup") {
    const N = activeChoices().length;
    if (isTriggered("left"))  { LU.sel = (LU.sel + N - 1) % N; beep(700, 0.05, 0.06); }
    if (isTriggered("right")) { LU.sel = (LU.sel + 1) % N; beep(700, 0.05, 0.06); }
    if (N === 4 && (isTriggered("up") || isTriggered("down"))) {
      LU.sel = (LU.sel + 2) % N; beep(700, 0.05, 0.06);
    }
    if (isTriggered("ok")) applyChoice(LU.sel);
    if (clickAt && N > 0) {                              // 鼠标可选
      for (let i = 0; i < N; i++) {
        const c = cardRect(i, N);
        if (clickAt.x >= c.x - 110 && clickAt.x <= c.x + 110 &&
            clickAt.y >= c.y - 46 && clickAt.y <= c.y + 46) {
          if (clickAt.moved !== false) { LU.sel = i; applyChoice(i); }
          break;
        }
      }
      clickAt = null;
    }
    decayFx(dt);
    return;
  }
  if (ST.scene === "intro") {
    if (ST.uiLock <= 0 && isTriggered("ok")) dismissIntro();
    decayFx(dt);
    return;
  }
  if (ST.scene === "over") {
    ST.overT += dt;
    if (ST.overT > 0.9) {
      if (!ST.cloudKicked) { ST.cloudKicked = true; kickCloud(); }
      if (isTriggered("left") || isTriggered("right")) { ST.overView = 1 - ST.overView; beep(700, 0.05, 0.06); }
      if (clickAt) {                                    // 页签 / 再来一局 点按（触屏）
        for (let i = 0; i < 2; i++) {
          const dx = i === 0 ? -100 : 100;
          if (Math.abs(clickAt.x - (W / 2 + dx)) < 75 && Math.abs(clickAt.y - 292) < 17) {
            ST.overView = i; beep(700, 0.05, 0.06);
          }
        }
        const wantRestart = Math.abs(clickAt.x - W / 2) < 140 && Math.abs(clickAt.y - 566) < 18;
        clickAt = null;
        if (wantRestart) {                              // 点按是明确意图，不吃 uiLock
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          startGame(); return;
        }
      }
      if (isTriggered("ok") && ST.uiLock <= 0) {
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        startGame(); return;
      }
      if (isTriggered("cancel")) {
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        startGame(); return;
      }
    }
    decayFx(dt);
    return;
  }
  if (ST.scene !== "play") { decayFx(dt); return; }

  /* Esc 暂停 */
  if (isTriggered("cancel")) { ST.scene = "pause"; PU.open = true; PU.sel = 0; beep(660, 0.06, 0.07); return; }
  /* M 音乐开关 */
  if (isTriggered("mute")) {}

  /* 触发排队中的升级 */
  if (ST.pending > 0) { openLevelup(); return; }

  ST.iframes = Math.max(0, ST.iframes - dt);
  ST.dodgeCd = Math.max(0, ST.dodgeCd - dt);
  ST.popT = Math.max(0, (ST.popT || 0) - dt);

  /* --- 波次调度 --- */
  if (ST.breather > 0) {
    ST.breather -= dt;
    if (ST.breather <= 0) {
      ST.waveT = WAVE_TIME; ST.waveElapsed = 0;
      if (ST.wave % 5 === 0 && !ST.bossDeployed) {
        ST.bossEarly = false; ST.bossQueued = false;
        startBossWarning();
      } else if (ST.bossQueued && !ST.bossWarn) {
        ST.bossQueued = false;
        startBossWarning();
      }
    }
  } else {
    ST.waveT -= dt; ST.spawnT -= dt; ST.waveElapsed += dt;
    if (ST.waveT <= 10 && !ST.lowWarned) {
      ST.lowWarned = true; beep(880, 0.09, 0.1);
      pushText(W / 2, 170, "最后10秒 · 蓝球可吞噬", "#4dd8ff", 20);
    }
    while (ST.forceQ.length && ST.waveElapsed >= ST.forceQ[0].at) {
      spawnEnemyOfKind(ST.forceQ.shift().kind, true);
    }
    if (ST.budget > 0 && ST.spawnT <= 0 &&
        ST.enemies.length < Math.min(20, 6 + ST.wave)) {
      spawnEnemy(); ST.spawnT = rnd(0.5, 1.2);
    }
    const fieldCleared = ST.budget <= 0 && ST.enemies.length === 0 && !ST.bossWarn;
    if (ST.waveT <= 0 || fieldCleared) {
      if (fieldCleared) {
        ST.orbRate = Math.max(0.3, ST.orbRate * 0.9);
        pushText(W / 2, 135, "提前清场 · 绿球生成 +10%", "#52ff9a", 18);
        seq([660, 880], 80);
      }
      ST.wave++;
      const fxB = ST.wave % 5 === 0 ? 60 + ST.wave * 18 : 60 + ST.wave * 45;
      ST.budget = Math.round(fxB + Math.min(
        playerValue() * (ST.wave % 5 === 0 ? 0.45 : 0.8), fxB * 2));
      ST.breather = 2.5;
      ST.shrinkAt = rnd(4, 24); ST.shrinkSpawned = false;
      ST.lowWarned = false;
      buildWaveSchedule();
      const nr = Math.ceil(ST.wave / 5);
      if (nr !== ST.curRound) {
        ST.curRound = nr; ST.bossDeployed = false;
        ST.bossPreset = Math.max(350 * Math.pow(2.0, nr - 1), ST.bossFloor);
      }
      pushText(W / 2, 100, "第 " + ST.wave + " 波", "#ffd24d", 26);
      beep(440, 0.12, 0.1);
    }
  }

  updateBossWarn(dt);

  /* 数值达到预警线：Boss 下一波开场来袭 */
  if (!ST.bossDeployed && !ST.bossWarn && !ST.bossQueued &&
      !ST.enemies.some(e => e.boss) && ST.pvAvg >= ST.bossPreset) {
    ST.bossEarly = true; ST.bossQueued = true; ST.bossDeployed = true;
    pushText(W / 2, 170, "数值超限 · BOSS 下一波来袭!", "#ff8fa3", 24);
    seq([220, 165], 120);
  }

  /* 遥测采样：峰值记录 */
  ST.sampleT -= dt;
  if (ST.sampleT <= 0) {
    ST.sampleT = 5;
    const pvS = Math.round(playerValue());
    if (pvS > ST.peak) ST.peak = pvS;
  }

  /* 连消链窗口 */
  if (ST.chain.t > 0) ST.chain.t -= dt; else ST.chain.n = 0;

  /* 再生流 */
  if (ST.upgrades.heal > 0) {
    const RG = ST.regen;
    RG.pause = Math.max(0, RG.pause - dt);
    ST.dispCd = Math.max(0, (ST.dispCd || 0) - dt);
    if (RG.pause <= 0) {
      RG.ramp = Math.min(1, RG.ramp + dt / 5);
      const rate = ST.upgrades.heal * (0.3 + 0.12 * ST.wave) * RG.ramp;
      ST.pv = playerValue() + rate * dt;
      RG.accum += rate * dt;
      if (RG.ramp >= 1) RG.fullT += dt;
      RG.disp = (RG.disp || 0) + rate * dt;
      if (RG.disp >= 1 && ST.dispCd <= 0) {
        const n = Math.floor(RG.disp);
        pushText(ST.mx, ST.my + pHalf() + 16, "+" + n, "#52ff9a", 13);
        RG.disp -= n; ST.dispCd = 1.2;
      }
    }
  }

  /* 冲刺：空格触发 */
  if (isTriggered("ok") && !ST.dodgeCd && ST.uiLock <= 0) {
    ST.dashT = 0.25;
    ST.iframes = 0.45;
    ST.dodgeCd = Math.max(1.5, 5 - 0.2 * ST.upgrades.spd);
    burst(ST.mx, ST.my, 12, "#4dd8ff");
    beep(300, 0.08, 0.07, "triangle");
  }

  /* 像素级移动 */
  if (ST.dashT > 0) ST.dashT = Math.max(0, ST.dashT - dt);
  let mvx = (isPressed("right") ? 1 : 0) - (isPressed("left") ? 1 : 0);
  let mvy = (isPressed("down") ? 1 : 0) - (isPressed("up") ? 1 : 0);
  if (TOUCH.joyId !== null) {                          // 虚拟摇杆接管移动
    const dz = TOUCH.R * 0.22;
    mvx = TOUCH.dx > dz ? 1 : TOUCH.dx < -dz ? -1 : 0;
    mvy = TOUCH.dy > dz ? 1 : TOUCH.dy < -dz ? -1 : 0;
  }
  ST.moving = !!(mvx || mvy);
  if (ST.moving || ST.dashT > 0) {
    let dirx = mvx, diry = mvy;
    if (!dirx && !diry && ST.dashT > 0) {               // 冲刺中无输入：沿面向方向
      dirx = ST.dir === 6 ? 1 : ST.dir === 4 ? -1 : 0;
      diry = ST.dir === 2 ? 1 : ST.dir === 8 ? -1 : 0;
    }
    const len = Math.hypot(dirx, diry) || 1;
    const spd = ST.dashT > 0 ? 600 :
      Math.pow(2, baseSpeed() + (isPressed("shift") ? 1 : 0)) * 11.25;
    ST.mx += dirx / len * spd * dt;
    ST.my += diry / len * spd * dt;
    if (mvx || mvy) ST.dir = mvy > 0 ? 2 : mvy < 0 ? 8 : mvx > 0 ? 6 : 4;
    if (ST.dashT > 0) {
      ST.parts.push({ x: ST.mx, y: ST.my, vx: 0, vy: 0, life: 0.3, color: "#4dd8ff", size: 5 });
    }
    ST.animT += dt;
  }
  ST.mx = clampN(ST.mx, 26, W - 26);
  ST.my = clampN(ST.my, 30, H - 24);
  const px = ST.mx, py = ST.my;
  /* 「镜」回放缓冲：每帧记录玩家位置，保留 4 秒 */
  MIRROR_TRACE.push({ x: px, y: py, t: ST.t });
  while (MIRROR_TRACE.length && MIRROR_TRACE[0].t < ST.t - 4) MIRROR_TRACE.shift();
  if (ST.moving || ST.dashT > 0) ST.lastMoveT = ST.t;

  /* --- 敌人：移动 --- */
  for (const e of ST.enemies) {
    e.cd = Math.max(0, e.cd - dt);
    e.age = (e.age || 0) + dt;
    if (e.boss) {                                        // Boss=移动钱袋：每9秒渗2颗
      e.leakT = (e.leakT == null ? 6 : e.leakT) - dt;
      if (e.leakT <= 0) {
        e.leakT = 9;
        const bv = Math.max(2, Math.round(e.value * 0.05));
        for (let i = 0; i < 2; i++)
          spawnOrb(clampN(e.x + rnd(-70, 70), 40, W - 40),
            clampN(e.y + rnd(-60, 70), 60, H - 60), bv, null, true);
      }
    }
    if (e.kind === "bounce") {                           // 红字阶段=可吞噬态
      const dev = ST.breather <= 0 && ST.waveT <= 10;
      if (dev !== !!e.dev) { e.dev = dev; if (dev) beep(980, 0.06, 0.07); }
    }
    if (e.kind === "big") {                              // 在场每6秒奖励-1
      const tk = Math.floor(e.age / 6);
      if (tk > (e.tick || 0)) {
        e.tick = tk;
        if (tk <= 5) pushText(e.x, e.y - 70, "奖励 -1", "#ff8fa3", 14);
      }
    }
    if (e.kind === "bounce" && ST.breather <= 0 && ST.waveT > 10) {  // 养球
      e.orbs = e.orbs == null ? 6 : e.orbs;
      e.dropT = (e.dropT == null ? 1.0 : e.dropT) - dt;
      if (e.dropT <= 0 && e.orbs > 0) {
        const window = ST.waveT - 10;
        e.dropT = Math.max(0.8, window / (e.orbs + 1));
        e.orbs--;
        spawnOrb(clampN(e.x, 40, W - 40), clampN(e.y, 60, H - 60), Math.round(rnd(3, 4)));
      }
    }
    if (e.kind === "bounce") {                           // 直线 + 四边反弹
      e.x += e.bx * SPD.bounce * dt;
      e.y += e.by * SPD.bounce * dt;
      const r = eRad(e);
      if (e.x < r)                   { e.x = r;           e.bx =  Math.abs(e.bx); }
      if (e.x > W - r)               { e.x = W - r;       e.bx = -Math.abs(e.bx); }
      if (e.y < r)                   { e.y = r;           e.by =  Math.abs(e.by); }
      if (e.y > H - r)               { e.y = H - r;       e.by = -Math.abs(e.by); }
    } else if (e.kind === "bossBar") {                   // 直线漂移+自旋
      e.x += e.bx * SPD.boss * dt;
      e.y += e.by * SPD.boss * dt;
      const m = 130;
      if (e.x < m)       { e.x = m;       e.bx =  Math.abs(e.bx); }
      if (e.x > W - m)   { e.x = W - m;   e.bx = -Math.abs(e.bx); }
      if (e.y < m)       { e.y = m;       e.by =  Math.abs(e.by); }
      if (e.y > H - m)   { e.y = H - m;   e.by = -Math.abs(e.by); }
      e.ang += e.wang * dt;
    } else if (e.kind === "bossCross") {                 // 八字轨道+四方齐射
      e.orbA += 0.5 * dt;
      e.x = W / 2 + 260 * Math.sin(e.orbA);
      e.y = H / 2 + 200 * Math.sin(e.orbA * 2);
      e.fireT -= dt;
      if (e.fireT <= 0) {
        e.fireT = 3.2;
        spawnBlackDir(e.x - e.armL - 26, e.y, -1, 0);
        spawnBlackDir(e.x + e.armL + 26, e.y, 1, 0);
        spawnBlackDir(e.x, e.y - e.armL - 26, 0, -1);
        spawnBlackDir(e.x, e.y + e.armL + 26, 0, 1);
        beep(180, 0.15, 0.12, "square");
      }
    } else if (e.kind === "mirror") {                    // 「镜」：回放你 3 秒前的路线
      e.radCur = clampN(radiusOf(e.value), 28, 80);      // 吃球涨个，封顶 80px
      if (ST.t - ST.lastMoveT > 2) {                     // 站桩超 2 秒：影子自己凑过来（防摆烂僵局）
        const dx = px - e.x, dy = py - e.y, d = Math.hypot(dx, dy) || 1;
        e.x += dx / d * 50 * dt; e.y += dy / d * 50 * dt;
      } else if (MIRROR_TRACE.length) {
        let i = 0;
        while (i < MIRROR_TRACE.length - 1 && MIRROR_TRACE[i + 1].t < ST.t - 3) i++;
        const p0 = MIRROR_TRACE[i];
        const k = Math.min(1, 6 * dt);                   // 平滑贴到"3 秒前的你"
        e.x += (p0.x - e.x) * k;
        e.y += (p0.y - e.y) * k;
      }
      const mdx = e.x - e.lx, mdy = e.y - e.ly;          // 影子的朝向与步态
      if (Math.abs(mdx) > 0.1 || Math.abs(mdy) > 0.1) {
        e.dir = Math.abs(mdx) > Math.abs(mdy) ? (mdx > 0 ? 6 : 4) : (mdy > 0 ? 2 : 8);
        e.animT += dt; e.moving = true;
      } else e.moving = false;
      e.lx = e.x; e.ly = e.y;
    } else {                                             // 追踪
      const dx = px - e.x, dy = py - e.y, d = Math.hypot(dx, dy) || 1;
      const base = e.boss ? SPD.boss : e.kind === "big" ? SPD.big : SPD.chase;
      const sp = base * clampN(1 - e.value / 2600, 0.55, 1);
      e.x += dx / d * sp * dt;
      e.y += dy / d * sp * dt;
    }
  }

  /* --- 敌人分离 --- */
  for (let i = 0; i < ST.enemies.length; i++) {
    for (let j = i + 1; j < ST.enemies.length; j++) {
      const a = ST.enemies[i], b = ST.enemies[j];
      if (a.kind === "bossBar" || b.kind === "bossBar" ||
          a.kind === "bossCross" || b.kind === "bossCross") continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      const min = eRad(a) + eRad(b) + 2;
      if (d < min) {
        const push = (min - d) * 0.3;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
      }
    }
  }

  /* --- 敌人：碰撞判定 + 击杀 --- */
  for (const e of ST.enemies) {
    let hit = false, hx = e.x, hy = e.y;
    if (e.kind === "bossBar") {
      const hx1 = Math.cos(e.ang) * e.barL / 2, hy1 = Math.sin(e.ang) * e.barL / 2;
      const ax = e.x - hx1, ay = e.y - hy1, bx2 = e.x + hx1, by2 = e.y + hy1;
      const abx = bx2 - ax, aby = by2 - ay;
      const tt = clampN(((px - ax) * abx + (py - ay) * aby) / (abx * abx + aby * aby || 1), 0, 1);
      hx = ax + abx * tt; hy = ay + aby * tt;
      hit = circleOctHit(hx, hy, e.barT / 2 + 2, px, py, pHalfX(), pHalf(), 0);
    } else if (e.kind === "bossCross") {
      const h1 = segClosest(px, py, e.x - e.armL, e.y, e.x + e.armL, e.y);
      const v1 = segClosest(px, py, e.x, e.y - e.armL, e.x, e.y + e.armL);
      if (Math.hypot(px - h1[0], py - h1[1]) <= Math.hypot(px - v1[0], py - v1[1])) {
        hx = h1[0]; hy = h1[1];
      } else { hx = v1[0]; hy = v1[1]; }
      hit = circleOctHit(hx, hy, e.armT / 2 + 2, px, py, pHalfX(), pHalf(), 0);
    } else {
      hit = circleOctHit(e.x, e.y, eRad(e), px, py, pHalfX(), pHalf(), 2);
    }
    if (e.cd <= 0 && ST.iframes > 0 && hit) {
      if (e.kind === "bounce") { devourBlue(e, hx, hy); }        // 无敌帧随时可吞蓝球
      else if (e.kind === "big") {                               // 无敌帧不挡手术
        clashPlayer(e.value, hx, hy, e.kind);
        burst(hx, hy, 14, "#ffd24d");
        killEnemy(e);
      }
    }
    if (e.cd <= 0 && ST.iframes <= 0 && hit) {
      if (e.boss && !e.cracked) {                                // 第一撞=裂开减半
        clashPlayer(e.value, hx, hy, e.kind);
        burst(hx, hy, 18, "#ffd24d");
        e.cracked = true;
        const preV = e.value;
        e.value = Math.ceil(e.value / 2);
        const cv2 = Math.max(2, Math.round(preV * 0.05));
        for (let i = 0; i < 3; i++)
          spawnOrb(e.x + rnd(-80, 80), e.y + rnd(-60, 80), cv2, null, true);
        pushText(e.x, e.y - 100, "钱袋裂开!", "#ffd24d", 16);
        e.cd = 1.5;
        pushText(e.x, e.y - 80, "裂开! 再撞一次 -" + e.value, "#ffd24d", 20);
        beep(330, 0.15, 0.12, "square");
      } else if (e.kind === "bounce" && e.dev) {                 // 红字吞噬
        devourBlue(e, hx, hy);
      } else {
        clashPlayer(e.value, hx, hy, e.kind);
        burst(hx, hy, 14, "#ffd24d");
        killEnemy(e);
      }
    }
  }
  ST.enemies = ST.enemies.filter(e => !e.dead);

  /* --- 资源球 --- */
  for (const o of ST.orbs) {
    for (const e of ST.enemies) {                        // 「镜」抢球：它走你走过的路，抢你抢过的钱
      if (e.kind !== "mirror") continue;
      if (Math.hypot(o.x - e.x, o.y - e.y) < eRad(e) + 10) {
        o.dead = true;
        e.value = Math.min(e.value + o.value, playerValue() + 300);
        burst(o.x, o.y, 5, "#b44dff");
        break;
      }
    }
    if (o.dead) continue;                                // 已被「镜」吃掉
    const dx = px - o.x, dy = py - o.y, d = Math.hypot(dx, dy) || 1;
    if (d < 95 * ST.magnetMul) {
      o.x += dx / d * 240 * dt; o.y += dy / d * 240 * dt;
    }
    if (o.life != null) {
      o.life -= dt;
      if (o.life <= 0) o.dead = true;
    }
    if (d < pHalfX() + 11) {
      const got = o.noMul ? o.value : o.value * ST.orbMul;
      ST.pv = playerValue() + got;
      pushText(o.x, o.y - 20, "+" + (Math.round(got * 10) / 10), "#52ff9a", 18);
      const oxp = o.value * 2;
      gainXp(oxp);
      pushText(o.x, o.y - 38, "EXP+" + oxp, "#7dffcf", 13);
      burst(o.x, o.y, 6, "#52ff9a");
      beep(940, 0.07, 0.08);
      o.dead = true;
    }
  }
  ST.orbs = ST.orbs.filter(o => !o.dead);
  ST.orbT -= dt;
  if (ST.orbT <= 0) {
    spawnOrb(undefined, undefined, Math.round(rnd(2, 5)));
    ST.orbT = rnd(2.0, 3.2) * ST.orbRate;
  }

  updateBlacks(dt, px, py);

  /* --- 每波一次的限时二选一 --- */
  if (!ST.shrinkSpawned && !ST.shrink && ST.breather <= 0 &&
      ST.waveElapsed >= ST.shrinkAt) {
    const win = rnd(3, 5);
    const reach = Math.pow(2, baseSpeed()) * 11.25 * win * 0.85;
    const dd2 = rnd(150, Math.max(160, reach));
    const a1 = rnd(0, 6.28);
    const a2 = a1 + rnd(2.1, 3.14);
    const items = [
      { kind: "shrink", x: clampN(px + Math.cos(a1) * dd2, 60, W - 60),
        y: clampN(py + Math.sin(a1) * dd2, 80, H - 80), rot: 0 },
      { kind: "xp", x: clampN(px + Math.cos(a2) * dd2, 60, W - 60),
        y: clampN(py + Math.sin(a2) * dd2, 80, H - 80), rot: 0 },
    ];
    ST.shrink = { t: win, items };
    ST.shrinkSpawned = true;
    beep(520, 0.1, 0.09, "triangle");
    pushText(px, py - 70, "挑战 · 二选一!", "#7dffcf", 16);
  }
  if (ST.shrink) {
    const sh = ST.shrink;
    sh.t -= dt;
    const blink = sh.t < 1.5;
    let best = null, bestD = 1e9;
    for (const it of sh.items) {
      it.rot += dt * 2;
      const dd2 = Math.hypot(px - it.x, py - it.y);
      if (dd2 < pHalfX() + 16 && dd2 < bestD) { bestD = dd2; best = it; }
      it.blink = blink;
    }
    if (best) {
      if (best.kind === "xp") {
        ST.xpMul = Math.round((ST.xpMul + 0.1) * 10) / 10;
        pushText(px, py - 56, "经验获取 +10%", "#ffd24d", 20);
      } else {
        ST.psizeMul = Math.max(0.35, ST.psizeMul * 0.9);
        pushText(px, py - 56, "体型 -10%", "#a78bff", 20);
      }
      seq([740, 592], 90);
      ST.shrink = null;
    } else if (sh.t <= 0) {
      ST.shrink = null;
    }
  }

  /* --- 胜负结算 --- */
  if (playerValue() <= 0.5) {
    ST.scene = "over"; ST.overT = 0; ST.uiLock = 0.5;
    const pvF = Math.round(playerValue());
    if (pvF > ST.peak) ST.peak = pvF;
    pushText(W / 2, H / 2, "数值归零 · 败北", "#ff6b6b", 32);
    seq([330, 247, 165], 140);
    const rec = { code: Math.random().toString(16).slice(2, 10),
      peak: Math.round(ST.peak), wave: ST.wave, kills: ST.kills,
      time: Math.round(ST.t), level: ST.level, grazes: ST.grazeN,
      ts: nowStr(), ver: VERSION };
    ST.myCode = rec.code;
    const r = lbSubmit(rec);
    ST.lbRank = r.rank; ST.lbTotal = r.total;
  }
  if (ST.bossSpawned && !ST.enemies.some(e => e.boss)) {
    ST.bossSpawned = false;
    ST.bossFloor = playerValue() * 2;
    pushText(W / 2, H / 2 - 40, "BOSS 击破 · 战利品！", "#52ff9a", 28);
    seq([523, 659, 784, 1047], 100);
  }

  decayFx(dt);
}

function txt(s, x, y, size, color, align = "center", weight = "bold") {

  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle";

}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }

function drawBackground() {
  ctx.fillStyle = "#05040f"; ctx.fillRect(0, 0, W, H);

    ctx.imageSmoothingEnabled = false;
    for (let gy = 0; gy < H; gy += 48)

function drawEnemy(e) {
  const flash = e.flash || 0;
  if (e.kind === "mirror" && MIRROR_READY) {           // 「镜」影子日奈
    const r = eRad(e);
    ctx.strokeStyle = e.cracked ? "rgba(176,176,192,0.6)" : "rgba(255,77,109,0.4)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, 6.2832); ctx.stroke();
    const sc = r / 24;
    const row = { 2: 0, 4: 1, 6: 2, 8: 3 }[e.dir] || 0;
    const col = e.moving ? [0, 1, 2, 1][Math.floor(e.animT * 8) % 4] : 1;
    ctx.save();
    ctx.translate(e.x, e.y + r);
    ctx.scale(-sc, sc);                                // 水平翻转 = 镜像
    ctx.globalAlpha = e.cracked ? 0.55 : 0.92;
    ctx.drawImage(MIRROR_SHEET, col * 64, row * 64, 64, 64, -32, -64, 64, 64);
    ctx.restore();
    ctx.globalAlpha = 1;
    txt(Math.round(e.value).toString(), e.x, e.y - r - 12, 16, "#ff8fa3");
    return;
  }
  if (e.kind === "bossBar") {
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.ang);
    ctx.fillStyle = "#1a1030"; ctx.fillRect(-150 - 10, -18, 320, 36);
    ctx.fillStyle = e.cracked ? "#8a7fa0" : e.color; ctx.fillRect(-150 - 7, -15, 314, 30);
    if (e.cracked) { ctx.fillStyle = "rgba(176,176,192,0.4)"; ctx.fillRect(-157, -18, 320, 36); }
    txt(Math.round(e.value).toString(), 0, 1, 20, "#ffffff");
    ctx.restore();
    return;
  }
  if (e.kind === "bossCross") {
    ctx.save(); ctx.translate(e.x, e.y);
    ctx.fillStyle = "#1a1030";
    ctx.fillRect(-e.armL - 10, -e.armT / 2 - 3, e.armL * 2 + 20, e.armT + 6);
    ctx.fillRect(-e.armT / 2 - 3, -e.armL - 10, e.armT + 6, e.armL * 2 + 20);
    ctx.fillStyle = e.cracked ? "#8a7fa0" : e.color;
    ctx.fillRect(-e.armL - 7, -e.armT / 2, e.armL * 2 + 14, e.armT);
    ctx.fillRect(-e.armT / 2, -e.armL - 7, e.armT, e.armL * 2 + 14);
    if (e.cracked) { ctx.fillStyle = "rgba(176,176,192,0.4)";
      ctx.fillRect(-e.armL - 10, -e.armT / 2 - 3, e.armL * 2 + 20, e.armT + 6);
      ctx.fillRect(-e.armT / 2 - 3, -e.armL - 10, e.armT + 6, e.armL * 2 + 20); }
    txt(Math.round(e.value).toString(), 0, 1, 20, "#ffffff");
    ctx.restore();
    return;
  }
  // 圆形敌人（含圆 Boss / 橙 / 红 / 蓝）
  const r = eRad(e) * (e.kind === "bounce" && e.dev ? 1 + 0.12 * Math.sin(ST.t * 8) : 1);
  ctx.fillStyle = (e.kind === "bounce" && e.dev) ? "#ffd24d" : "#1a1030";
  circle(e.x, e.y, r + 3);
  ctx.fillStyle = flash > 0 ? "#ffffff" : e.color;
  circle(e.x, e.y, r);
  if (e.cracked) { ctx.fillStyle = "rgba(176,176,192,0.45)"; circle(e.x, e.y, r); }
  const fs = Math.max(10, Math.min(28, r * 0.7));
  txt(Math.round(e.value).toString(), e.x, e.y + 1, fs, "#ffffff");
}

  const hint = ST.overView === 1 && ST.t - ST.msgSentT < 2 ? "留言已发送!" : "← → 切换 · 点此再来一局";
  ctx.fillStyle = "rgba(16,12,36,0.88)";
  ctx.fillRect(cx - 145, 548, 290, 36);
  ctx.fillStyle = ST.overView === 1 && ST.t - ST.msgSentT < 2 ? "#52ff9a" : "#7dffcf";
  ctx.fillRect(cx - 145, 548, 290, 2); ctx.fillRect(cx - 145, 582, 290, 2);
  txt(hint, cx, 566, 17, ST.overView === 1 && ST.t - ST.msgSentT < 2 ? "#52ff9a" : "#7dffcf");
}

/* ============ 主渲染 ============ */
function render() {
  drawBackground();
  // 冲刺预警圈（Boss）
  if (ST.bossWarn) {
    const w = ST.bossWarn;
    const sc = 1 + 0.1 * Math.sin(ST.t * 7);
    ctx.fillStyle = "rgba(255,77,109,0.28)";
    circle(w.x, w.y, (w.zr + 18) * sc);
    ctx.fillStyle = "#ff4d6d"; circle(w.x, w.y, 8);
    txt("BOSS 降落 " + Math.max(0, Math.ceil(w.t)), w.x, w.y - 70, 20, "#ff8fa3");
  }
  for (const o of ST.orbs) {
    const sc = 1 + 0.14 * Math.sin(ST.t * 5 + o.ph);
    ctx.fillStyle = "#0d2818"; circle(o.x, o.y, 11 * sc);
    ctx.fillStyle = "#52ff9a"; circle(o.x, o.y, 9 * sc);
  }
  drawPlayer();
  for (const e of ST.enemies) drawEnemy(e);
  for (const b of ST.blacks) drawBlack(b);
  if (ST.shrink) {
    for (const it of ST.shrink.items) {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
      if (it.blink) ctx.globalAlpha = Math.sin(ST.t * 18) > 0 ? 1 : 0.31;
      ctx.fillStyle = "#2a1a4d"; ctx.fillRect(-23, -23, 46, 46);
      ctx.fillStyle = it.kind === "shrink" ? "rgba(167,139,255,0.85)" : "rgba(255,210,77,0.9)";
      ctx.fillRect(-15, -15, 30, 30);
      ctx.rotate(-it.rot);
      txt(it.kind === "shrink" ? "-10%" : "EXP", 0, 1, 13, "#ffffff");
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }
  for (const p of ST.parts) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - (p.size || 6) / 2, p.y - (p.size || 6) / 2, p.size || 6, p.size || 6);
  }
  for (const t of ST.texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2);
    txt(t.text, t.x, t.y, t.size, t.color);
    ctx.globalAlpha = 1;
  }
  if (ST.active) drawHUD();
  if (ST.active && ST.scene === "play") drawTouchUI();
  if (ST.scene === "intro") drawIntro();
  else if (ST.scene === "levelup") drawLevelup();
  else if (ST.scene === "pause") drawPause();
  else if (ST.scene === "over") drawOver();
  syncOverlays();
}

/* ============ 暂停菜单输入 ============ */
function tickPause() {
  if (isTriggered("up") || isTriggered("down")) { PU.sel = 1 - PU.sel; beep(700, 0.05, 0.06); }
  if (isTriggered("cancel")) { ST.scene = "play"; ST.uiLock = 0.2; beep(660, 0.06, 0.07); return; }
  if (clickAt) {
    for (let i = 0; i < 2; i++) {
      const y = H / 2 - 30 + i * 56;
      if (clickAt.x >= W / 2 - 140 && clickAt.x <= W / 2 + 140 &&
          clickAt.y >= y - 22 && clickAt.y <= y + 22) {
        PU.sel = i; hit.ok = true;                     // 点按直接生效（触屏友好）
        break;
      }
    }
    clickAt = null;
  }
  if (isTriggered("ok")) {
    if (PU.sel === 0) { ST.scene = "play"; ST.uiLock = 0.2; beep(660, 0.06, 0.07); }
    else { beep(784, 0.1, 0.1); startGame(); }
  }
}

/* ============ 主循环（固定 1/60 步长，与原版一致） ============ */
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 5) {
    if (ST.scene === "pause") tickPause();
    else updateClash(1 / 60);
    BGM.update();
    clickAt = null;
    clearTriggers();
    acc -= 1000 / 60; n++;
  }
  render();
  requestAnimationFrame(frame);
}
/* ============ 覆盖输入框（ID / 留言） ============ */
const nameIn = document.getElementById("nameIn");
const msgIn = document.getElementById("msgIn");
const msgBtn = document.getElementById("msgBtn");
const msgRow = document.getElementById("msgRow");
try { nameIn.value = (localStorage.getItem("clash_name") || "").trim().slice(0, 12); } catch (e) {}
nameIn.addEventListener("change", () => {
  const nm = nameIn.value.trim().slice(0, 12);
  try { localStorage.setItem("clash_name", nm); } catch (e) {}
  if (ST.scene === "over" && ST.myCode) {
    if (ST.cloudState === "ok") {                      // 直接改本条云端成绩
      cloudRename(ST.myCode, nm).then(list => {
        if (list) { ST.cloudList = list; ST.idUpdT = ST.t; }
      });
    } else if (ST.cloudState === "loading") {          // 上传中改名：挂起，传完自动补改
      ST.renamePending = true;
    }
  }
});
async function sendMsg() {
  const text = msgIn.value;
  if (!text.trim()) return;
  msgBtn.disabled = true;
  const list = await cloudSendMessage({ name: playerName(), text, ts: nowStr() });
  msgBtn.disabled = false;
  if (list) { ST.msgList = list; ST.msgSentT = ST.t; msgIn.value = ""; }
}
msgBtn.addEventListener("click", sendMsg);
msgIn.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendMsg(); } });
function syncOverlays() {
  const over = ST.scene === "over" && ST.overT > 0.9;
  nameIn.style.display = over ? "block" : "none";
  msgRow.style.display = over && ST.overView === 1 ? "block" : "none";
}

startGame();                            // 首屏：startGame → 规则页（按空格开局）
requestAnimationFrame(frame);
</script>
